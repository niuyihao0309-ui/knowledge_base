# Milvus + MongoDB —— Windows / Docker Desktop (WSL2 后端)
# 从虚拟机 192.168.10.100 迁移而来
#   · Milvus 来自 VM 的 /root/docker_soft/docker-compose.yml
#   · MongoDB 来自 VM 上 docker run 手工启动的 mongo 容器（已改写为 compose 服务）
# 用法：在本文件所在目录执行  docker compose up -d
#
# 与 VM 原版的差异：
#   1. 去掉已废弃的 version: '3.5'（消除 "version is obsolete" 警告）
#   2. 镜像版本改用本机已有版本，无需联网 pull
#   3. 删除 attu 里 /root/milvus:/app/tls 这个 Linux 绝对路径挂载（在 Windows 上会直接报错）
#   4. Attu 端口由 VM 的 7000 改为 8000（本机 7000 未占用，想还原改回去即可）
#   5. 卷挂载统一用 ./volumes 相对路径，方便把 VM 的 volumes 直接解压进来
#   6. 新增 mongo 服务：VM 上原为匿名卷（/var/lib/docker/volumes/<hash>/_data），
#      这里改为 bind mount ./volumes/mongo，数据已全量迁移；保持无认证（与 VM 一致）

name: milvus

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  attu:
    container_name: milvus-attu
    image: zilliz/attu:latest
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: http://standalone:19530
    depends_on:
      - "standalone"

  mongo:
    container_name: mongo
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
