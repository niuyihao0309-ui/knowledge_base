<!DOCTYPE html>
<!--
  ============================================================================
  统一入口门户（Portal / 工作台）
  ----------------------------------------------------------------------------
  版式来源：桌面稿 unified-entry-final.html（顶栏 → Hero → 核心能力卡片 → 页脚）
  工程逻辑：沿用原 index.html 的 PORTAL_CONFIG 数据驱动架构

  路由归属（两个服务都挂了 GET / 返回本页，从哪个端口进来都能当门户用）：
    · http://127.0.0.2:8005/  → 本页（文档导入所在服务）
    · http://127.0.0.1:8003/  → 本页（知识问答所在服务）

  【保留了原 index.html 的三项工程能力，一条没丢】
    1) PORTAL_CONFIG 单一配置源 —— 加模块 / 改名 / 换端口只动这一个对象；
    2) resolveHref() 端口判定 —— 门户挂在 8003 时，"文档导入"卡必须走 8005 的绝对
       地址，否则会跳成 127.0.0.1:8003/import.html → 404；
    3) stampHtml() 配置指纹 —— 页脚那行小字，用来一眼识别"手上这份页面是不是最新
       配置"（浏览器缓存 / 恢复标签页会还原旧渲染快照，卡片 href 还停在老端口）。

  【设计原则：尽量减少静态元素】
    页面零图片资源（没有任何 png/jpg 文件），图标一律内联 SVG；
    卡片 HTML 全部由文件末尾的 PORTAL_CONFIG 渲染出来，文案 / 链接 / 主题色都是数据。
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>统一入口</title>
<meta name="description" content="从外部文档导入到智能问答，所有知识操作在同一入口完成。">
<style>
/* ---------------------------------------------------------------------------
   Design tokens —— 沿用桌面稿那套「浅底 + 衬线标题 + 蓝色强调」体系
   --------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  /* 色板 */
  --bg:            #f8f9fb;
  --surface:       #ffffff;
  --surface-2:     #fbfcfe;
  --fg:            #111827;
  --muted:         #6b7280;
  --border:        #e5e7eb;
  --accent:        #2563eb;
  --accent-ink:    #1d4ed8;
  --accent-soft:   rgba(37, 99, 235, .10);
  --accent-line:   rgba(37, 99, 235, .32);

  /* 字体：衬线做标题，系统无衬线做正文 */
  --font-display: "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

  /* 字号 —— 流体 */
  --fs-h1:   clamp(2.5rem, 1.35rem + 4.6vw, 4.5rem);    /* 40 → 72 */
  --fs-h2:   clamp(1.6rem, 1.1rem + 2vw, 2.4rem);       /* 25.6 → 38.4 */
  --fs-h3:   clamp(1.125rem, 1rem + .5vw, 1.375rem);    /* 18 → 22 */
  --fs-lead: clamp(1rem, .94rem + .35vw, 1.1875rem);    /* 16 → 19 */
  --fs-body: 1rem;
  --fs-sm:   .9375rem;
  --fs-meta: .8125rem;

  /* 版式尺寸 */
  --container:  1120px;
  --gutter:     clamp(20px, 5vw, 48px);
  --section-y:  clamp(64px, 8vw, 120px);
  --nav-h:      64px;

  --radius-sm: 10px;
  --radius:    14px;
  --radius-lg: 20px;
  --radius-pill: 999px;

  --shadow-1: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .05);
  --shadow-3: 0 28px 56px -24px rgba(37, 99, 235, .34), 0 4px 14px -6px rgba(15, 23, 42, .10);

  --ease: cubic-bezier(.2, .7, .3, 1);
  --dur: 190ms;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--fg);
  background: var(--bg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.6;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
::selection { background: rgba(37, 99, 235, .18); }

/* --------------------------- 背景氛围层（纯装饰，不参与布局） ---------------- */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(58rem 38rem at 50% -12%, rgba(37, 99, 235, .17), transparent 62%),
    radial-gradient(42rem 30rem at 104% -4%, rgba(124, 58, 237, .11), transparent 60%),
    radial-gradient(36rem 26rem at -8% 22%, rgba(14, 165, 233, .09), transparent 62%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg) 68%, #eff3f9 100%);
}
.aurora::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(15, 23, 42, .05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(15, 23, 42, .05) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(72% 52% at 50% 0%, #000 0%, transparent 100%);
          mask-image: radial-gradient(72% 52% at 50% 0%, #000 0%, transparent 100%);
}

header, main, footer { position: relative; z-index: 1; }

.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.meta {
  font-family: var(--font-mono);
  font-size: var(--fs-meta);
  color: var(--muted);
  letter-spacing: .01em;
}

/* ================================ 顶栏 =================================== */
.topnav {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: var(--nav-h);
  background: rgba(248, 249, 251, .78);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
          backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: var(--nav-h);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 1.125rem;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
}
.brand-mark {
  width: 26px;
  height: 26px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #fff;
  background: linear-gradient(150deg, #3b82f6, var(--accent-ink));
  box-shadow: 0 2px 6px -2px rgba(37, 99, 235, .6);
}
.brand-mark svg { width: 15px; height: 15px; }

.nav-links { display: flex; align-items: center; gap: clamp(16px, 3vw, 34px); }
.nav-links a {
  position: relative;
  padding-block: 4px;
  font-size: var(--fs-sm);
  color: var(--muted);
  transition: color var(--dur) var(--ease);
}
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 1.5px;
  border-radius: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 220ms var(--ease);
}
.nav-links a:hover { color: var(--fg); }
.nav-links a:hover::after { transform: scaleX(1); }

/* ================================= Hero ================================== */
.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: clamp(400px, 56vh, 600px);
  padding-block: clamp(64px, 11vw, 132px);
}
.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.eyebrow::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .16);
}

.hero-title {
  font-family: var(--font-display);
  font-size: var(--fs-h1);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -.022em;
  max-width: 20ch;
}
.hero-lead {
  font-size: var(--fs-lead);
  line-height: 1.65;
  color: var(--muted);
  max-width: 46ch;
}

/* ================================ 区块 =================================== */
.section { padding-block: var(--section-y); }
.section + .section { border-top: 1px solid var(--border); }

.section-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: clamp(32px, 5vw, 56px);
}
.section-head h2 {
  font-family: var(--font-display);
  font-size: var(--fs-h2);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -.018em;
}

/* =============================== 入口卡 ================================== */
.entry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: clamp(16px, 2vw, 24px);
}

/* 整块是 <a>：可点、可 Tab 聚焦、可回车触发 */
.entry-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: clamp(230px, 26vw, 280px);
  padding: clamp(24px, 2.6vw, 34px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  transition: transform .24s var(--ease), border-color .24s var(--ease),
              box-shadow .24s var(--ease);
  /* 只填 backwards：保留入场延迟期的初始态，动画结束后让位给 hover 的 transform。
     若写成 both/forwards，动画终帧会一直覆盖 hover 位移，卡片就抬不起来。 */
  animation: rise 380ms cubic-bezier(.22, .61, .36, 1) backwards;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.entry-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-line);
  box-shadow: var(--shadow-3);
}
.entry-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
/* 顶部高光条：hover 时从中心展开 */
.entry-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  transform: scaleX(0);
  transition: transform .3s var(--ease);
}
.entry-card:hover::before { transform: scaleX(1); }

.entry-icon {
  width: 46px;
  height: 46px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--radius);
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}
.entry-icon svg { width: 22px; height: 22px; }

.entry-name {
  display: block;
  font-size: var(--fs-h3);
  font-weight: 600;
  letter-spacing: -.008em;
  line-height: 1.35;
}
.entry-desc {
  display: block;
  font-size: var(--fs-sm);
  line-height: 1.65;
  color: var(--muted);
  max-width: 34ch;
}

.entry-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--fg);
}
.entry-arrow {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 50%;
  color: var(--accent);
  background: var(--accent-soft);
  transition: transform .24s var(--ease), background .24s var(--ease), color .24s var(--ease);
}
.entry-arrow svg { width: 15px; height: 15px; }
.entry-card:hover .entry-arrow {
  transform: translateX(3px);
  background: var(--accent);
  color: #fff;
}

/* ================================ 页脚 =================================== */
.page-foot {
  margin-top: 64px;
  padding-block: clamp(32px, 4vw, 48px);
  border-top: 1px solid var(--border);
  background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .7));
}
.foot-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  font-size: var(--fs-meta);
  color: var(--muted);
}

/* --------------------------- 配置指纹（诊断用） ---------------------------- */
/* 页脚永远显示的一行小字：本页从哪来 + 每张卡片实际会跳到哪。
   浏览器缓存 / 「恢复上次标签页」可能还原旧渲染快照，那时卡片 href 还停在老端口，
   用户点了就跳死链却看不出页面是旧的。有这行指纹，端口对不上就能立刻判定，
   Ctrl+F5 刷新即可拿到最新配置。纯诊断信息，不影响功能。 */
.portal-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 20px;
}
.portal-stamp {
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.9;
  color: var(--muted);
  text-align: center;
  word-break: break-word;
}
.portal-stamp code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #4b5563;
  background: rgba(17, 24, 39, .05);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  white-space: nowrap;
}

.foot-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  font-size: var(--fs-sm);
  font-family: inherit;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: border-color var(--dur) var(--ease);
}
.foot-btn:hover { border-color: var(--fg); }
.foot-btn svg { width: 14px; height: 14px; }

/* ============================== 响应式 =================================== */
@media (max-width: 860px) {
  .entry-grid { grid-template-columns: minmax(0, 1fr); }
  .entry-card { min-height: 0; }
  .entry-desc { max-width: none; }
}

@media (max-width: 560px) {
  .brand-mark { display: none; }
  .nav-links { gap: 20px; }
  .hero { min-height: auto; }
  .foot-inner { flex-direction: column; align-items: flex-start; gap: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .entry-card { animation: none; }
  .entry-card, .entry-card::before, .entry-arrow, .nav-links a::after { transition: none; }
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<header class="topnav">
  <div class="container nav-inner">
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </span>
      <span id="portalBrand">统一入口</span>
    </a>
    <nav class="nav-links" id="navLinks" aria-label="模块导航"></nav>
  </div>
</header>

<main id="content">
  <section class="hero" id="top">
    <div class="container hero-inner">
      <p class="eyebrow" id="portalEyebrow"></p>
      <h1 class="hero-title" id="portalTitle"></h1>
      <p class="hero-lead" id="portalSubtitle"></p>
    </div>
  </section>

  <section class="section" id="features">
    <div class="container">
      <div class="section-head" id="sectionHead"><h2 id="portalSectionTitle"></h2></div>
      <div class="entry-grid" id="cardGrid" aria-label="功能入口"></div>
    </div>
  </section>
</main>

<footer class="page-foot">
  <div class="container foot-inner">
    <span id="footCopy"></span>
    <span class="meta" id="footMeta"></span>
  </div>
  <div class="container portal-foot" id="portalFoot"></div>
</footer>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     ★★★ 唯一需要改的地方：入口配置 ★★★
     --------------------------------------------------------------------------
     以后加功能、改名、换端口，只动这个对象，不用碰上面的 HTML/CSS。
     ========================================================================== */
  var PORTAL_CONFIG = {
    // ---- 品牌 / 标题区 ----
    brand: '知识与文档',                              // 顶栏品牌名 + 页脚版权
    eyebrow: '统一入口',                              // 大标题上方的小标签（留空则不显示）
    title: '统一入口',                                // 浏览器标签页标题的主词
    headline: '文档与知识，一处触达',                   // Hero 大标题
    subtitle: '从外部文档导入到智能问答，所有知识操作在同一入口完成。',  // Hero 副标题
    sectionTitle: '核心能力',                          // 卡片区标题（留空则整块隐藏）

    // ---- 彻底动态：留空则不请求；填上后端接口地址就用接口返回的 JSON 覆盖本地配置 ----
    // 例如 configUrl: '/portal/config'
    configUrl: '',

    // ---- 功能卡片列表：想加"更多智能体"，往数组里再加一条就行 ----
    modules: [
      {
        id: 'import',                                            // 唯一标识，用于调试/埋点
        name: '文档导入',                                          // 卡片标题
        desc: '支持通过链接导入外部文档，自动解析内容并纳入知识体系。', // 卡片描述
        cta: '开始导入',                                           // 卡片底部行动文案
        // href：绝对地址，双击打开本文件时也能正常跳转
        href: 'http://127.0.0.2:8005/import.html',
        // path：同源相对路径。仅当"本页所在端口"等于下面的 port 时才用它（见 resolveHref）
        path: '/import.html',
        port: '8005',                                             // 该功能所在服务的端口
        accent: '#2563EB',                                        // 卡片主题色（留空则用全局 --accent）
        // 图标：内联 SVG 的路径数据，零图片资源
        icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>'
      },
      {
        id: 'query',
        name: '知识问答',
        desc: '基于已导入的知识库进行智能问答，支持上下文追问与引用溯源。',
        cta: '开始提问',
        href: 'http://127.0.0.1:8003/chat.html',
        path: '/chat.html',
        port: '8003',
        accent: '#2563EB',
        icon: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'
      }
    ],

    // ---- 底部可选按钮：不想要就写 null ----
    // footer: { text: '更多智能体', href: '#' }
    footer: null,

    // ---- 配置指纹：会原样印在页脚，用来一眼识别"手上这份页面是不是最新配置" ----
    // 改端口 / 改卡片时顺手把这里也改一下（不必精确，能区分新旧就行）。
    stamp: '2026-10-16 · 导入 8005 / 问答 8003',

    // ---- 跳转方式：'_self' 本页跳转（默认）；'_blank' 新标签页打开 ----
    target: '_self'
  };
  /* ==========================================================================
     ★★★ 配置到此结束，下面是通用渲染逻辑，正常不用改 ★★★
     ========================================================================== */


  /* ---------------------------------------------------------------- 小工具 */

  // #RRGGBB → rgba(r,g,b,a)，用于从主题色派生浅色底 / 边框
  function hexToRgba(hex, alpha) {
    var h = String(hex || '#2563EB').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];   // 支持 #abc 简写
    var n = parseInt(h, 16);                                            // 转成整数
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  // 页面是否通过 http(s) 提供服务（file:// 直开时不算）
  function isServedOverHttp() {
    return /^https?:$/.test(location.protocol);
  }

  // 决定一个模块最终跳到哪：
  // · 页面走 file:// 直开 → 只能用绝对地址 href
  // · 页面走 http，且"当前端口 == 该模块服务的端口" → 用同源相对路径 path（不用写死 IP）
  // · 否则（门户挂在 8003，但导入服务在 8005）→ 必须用绝对地址 href，否则会 404
  function resolveHref(m) {
    if (m.path && isServedOverHttp() && String(location.port) === String(m.port)) {
      return m.path;
    }
    return m.href || '#';
  }

  // 转义：配置里如果有人写了 < > & 之类，不至于把结构搞坏
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 卡片 accent 色 → 内联 CSS 变量（每张卡各自一套，互不干扰）
  function accentVars(accent) {
    return '--accent:' + esc(accent) + ';' +
           '--accent-soft:' + hexToRgba(accent, .12) + ';' +
           '--accent-line:' + hexToRgba(accent, .32) + ';';
  }

  // 「配置指纹」：打印本页来源 + 每张卡片最终会跳到的地址。
  // 这三个值全部取"当前这份 DOM 渲染时"的真实值。
  // 若某个端口号和你预期的不一样（比如停在已经废弃的老端口），
  // 说明浏览器给你的是缓存的旧渲染快照 —— Ctrl+F5 强制刷新即可。
  function stampHtml(cfg) {
    var from = isServedOverHttp()
      ? (location.host + location.pathname)                 // 例：127.0.0.1:8003/
      : '本地文件（file://）';
    var targets = (cfg.modules || []).map(function (m) {
      return esc(m.name) + ' → <code>' + esc(resolveHref(m)) + '</code>';
    }).join('&nbsp;&nbsp;·&nbsp;&nbsp;');
    return '' +
      '<div class="portal-stamp">' +
      '页面来源 <code>' + esc(from) + '</code>' +
      '&nbsp;&nbsp;|&nbsp;&nbsp;配置指纹 <code>' + esc(cfg.stamp || 'n/a') + '</code>' +
      '<br>' + targets +
      '</div>';
  }

  /* ---------------------------------------------------------------- 渲染 */

  // 单张卡片的 HTML 模板
  function cardHtml(m, index) {
    var accent = m.accent || '#2563EB';
    return '' +
      '<a class="entry-card" href="' + esc(resolveHref(m)) + '"' +
      '   target="' + esc(PORTAL_CONFIG.target || '_self') + '"' +
      '   style="' + accentVars(accent) + 'animation-delay:' + (index * 70) + 'ms"' +
      '   data-module="' + esc(m.id || '') + '">' +
      '  <span class="entry-icon" aria-hidden="true">' +
      '    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"' +
      '         stroke-linecap="round" stroke-linejoin="round">' + (m.icon || '') + '</svg>' +
      '  </span>' +
      '  <span class="entry-name">' + esc(m.name) + '</span>' +
      '  <span class="entry-desc">' + esc(m.desc) + '</span>' +
      '  <span class="entry-foot">' +
      '    <span class="entry-cta">' + esc(m.cta || '进入') + '</span>' +
      '    <span class="entry-arrow" aria-hidden="true">' +
      '      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"' +
      '           stroke-linecap="round" stroke-linejoin="round">' +
      '        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>' +
      '      </svg>' +
      '    </span>' +
      '  </span>' +
      '</a>';
  }

  // 顶栏导航：由 modules 生成，加模块会自动多一个链接
  function navHtml(cfg) {
    return (cfg.modules || []).map(function (m) {
      return '<a href="' + esc(resolveHref(m)) + '" target="' + esc(cfg.target || '_self') + '">' +
             esc(m.name) + '</a>';
    }).join('');
  }

  // 把整份配置画到页面上（可重复调用，会被"配置接口"再次触发以刷新内容）
  function render(cfg) {
    // 浏览器标签页标题：例「统一入口 · 知识与文档」
    document.title = (cfg.title || '统一入口') + (cfg.brand ? ' · ' + cfg.brand : '');

    // 顶栏品牌
    document.getElementById('portalBrand').textContent = cfg.brand || cfg.title || '';

    // 大标题上方的小标签（没配就整块隐藏，不留空行）
    var eb = document.getElementById('portalEyebrow');
    eb.textContent = cfg.eyebrow || '';
    eb.style.display = cfg.eyebrow ? '' : 'none';

    // Hero 大标题 / 副标题
    document.getElementById('portalTitle').textContent = cfg.headline || '';
    var sub = document.getElementById('portalSubtitle');
    sub.textContent = cfg.subtitle || '';
    sub.style.display = cfg.subtitle ? '' : 'none';

    // 卡片区标题
    var head = document.getElementById('sectionHead');
    document.getElementById('portalSectionTitle').textContent = cfg.sectionTitle || '';
    head.style.display = cfg.sectionTitle ? '' : 'none';

    // 卡片网格 + 顶栏导航
    document.getElementById('cardGrid').innerHTML = (cfg.modules || []).map(cardHtml).join('');
    document.getElementById('navLinks').innerHTML = navHtml(cfg);

    // 页脚：版权 + 模块清单（全部由配置派生，不写死）
    document.getElementById('footCopy').textContent =
      '© ' + (cfg.brand || cfg.title || '') + ' · ' + new Date().getFullYear();
    document.getElementById('footMeta').textContent =
      [cfg.title].concat((cfg.modules || []).map(function (m) { return m.name; })).join(' · ');

    // 页脚诊断区：可选按钮（配了才渲染）+ 配置指纹（永远渲染）
    var foot = document.getElementById('portalFoot');
    var footParts = [];

    if (cfg.footer && cfg.footer.text) {
      footParts.push(
        '<a class="foot-btn" href="' + esc(cfg.footer.href || '#') + '">' +
        esc(cfg.footer.text) +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
        ' stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>' +
        '</a>'
      );
    }

    footParts.push(stampHtml(cfg));                  // 诊断指纹，始终显示
    foot.innerHTML = footParts.join('');
  }

  /* ---------------------------------------------------------------- 启动 */

  // 1) 先用本地配置渲染，保证"接口挂了页面也照常能用"
  render(PORTAL_CONFIG);

  // 2) 如果配了后端配置接口，再拉一次覆盖（失败就静默保持本地配置）
  if (PORTAL_CONFIG.configUrl) {
    fetch(PORTAL_CONFIG.configUrl, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (remote) { if (remote && remote.modules) render(remote); })
      .catch(function () { /* 静默降级：继续用本地 PORTAL_CONFIG */ });
  }
})();
</script>
</body>
</html>
