<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库文件导入</title>
<style>
/* ============================================================
   设计 token（沿用原 od-* 企业蓝体系，去掉 app shell 后独立成页）
   ============================================================ */
:root {
  --bg-top: #F5F6F8;
  --bg-bottom: #ECEEF2;
  --surface: #FFFFFF;
  --surface-muted: #F2F4F6;
  --surface-soft: #FBFCFD;

  --ink: #171C25;
  --ink-2: #4D5661;
  --ink-3: #78818D;

  --border: #E2E5EA;
  --border-strong: #C7CCD3;

  --accent: #2E5591;
  --accent-hover: #254676;
  --accent-soft: #E7ECF3;

  --success: #2E7D57;
  --success-soft: #E7F0EA;
  --warning: #96691F;
  --danger: #B4453D;
  --danger-soft: #F4E7E5;

  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 14px;

  --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
  --shadow-pop: 0 12px 32px rgba(16,24,40,.12);
  --shadow-cta: 0 6px 18px rgba(46,85,145,.26);

  --font: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --dur: 190ms;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  color: var(--ink);
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.icon { width: 18px; height: 18px; flex: none; display: block; }

/* ============================================================
   页面容器：居中、聚焦
   ============================================================ */
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 44px 28px 56px;
}

/* ---------- 页头 ---------- */
.page-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 26px;
}
.head-icon {
  width: 46px; height: 46px; flex: none;
  border-radius: 13px;
  display: grid; place-items: center;
  color: #fff;
  background: linear-gradient(135deg, #3E6BB0 0%, #2E5591 100%);
  box-shadow: 0 6px 16px rgba(46,85,145,.30);
}
.head-icon .icon { width: 23px; height: 23px; }
.page-title { font-size: 24px; font-weight: 600; letter-spacing: .2px; line-height: 1.3; }
.page-desc { color: var(--ink-2); font-size: 16px; margin-top: 5px; max-width: 62ch; }

/* ---------- 布局：主区 + 侧栏 ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 22px;
  align-items: start;
}
.col-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.col-side { display: flex; flex-direction: column; gap: 18px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.card-body { padding: 22px; }

/* ============================================================
   上传区（视觉焦点）
   ============================================================ */
.dropzone {
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--surface-soft) 0%, #F3F5F8 100%);
  padding: 48px 24px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 13px;
  cursor: pointer;
  transition: border-color var(--dur) ease, background var(--dur) ease, transform var(--dur) ease;
}
.dropzone:hover { border-color: var(--accent); border-style: solid; background: var(--accent-soft); transform: translateY(-1px); }
.dropzone.is-drag { border-color: var(--accent); border-style: solid; background: var(--accent-soft); transform: scale(1.006); }

.dz-icon {
  width: 60px; height: 60px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 6px 16px rgba(16,24,40,.07);
  display: grid; place-items: center;
  color: var(--accent);
}
.dz-icon .icon { width: 26px; height: 26px; }
.dz-title { font-size: 16px; font-weight: 600; }
.dz-title .link { color: var(--accent); }
.dz-desc { font-size: 13px; color: var(--ink-3); }
.dz-formats { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 3px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 25px; padding: 0 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 12px; color: var(--ink-2); font-weight: 500;
  box-shadow: 0 1px 1px rgba(16,24,40,.03);
}
.chip .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--ink-3); }
.chip.pdf .dot { background: #B4453D; }
.chip.md .dot { background: #3C4A5E; }

/* ============================================================
   待导入队列
   ============================================================ */
.queue-head {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 22px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface-soft);
}
.queue-title { font-size: 15px; font-weight: 600; }
.count-pill {
  display: inline-grid; place-items: center;
  min-width: 22px; height: 22px; padding: 0 7px;
  border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 600;
}
.spacer { flex: 1; }

.queue-list { display: flex; flex-direction: column; }

.qfile {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
  animation: rowIn 240ms ease both;
}
.qfile:last-child { border-bottom: 0; }
@keyframes rowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.qfile-icon {
  width: 38px; height: 38px; flex: none;
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; letter-spacing: .3px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
}
.qfile-icon.pdf { color: #A63D33; }
.qfile-icon.md { color: #3C4A5E; }
.qfile-main { flex: 1; min-width: 0; }
.qfile-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qfile-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.qfile-progress { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 160ms linear; }
.progress.success > span { background: var(--success); }
.progress.error > span { background: var(--danger); }
.qfile-status { font-size: 12px; color: var(--ink-3); flex: none; }
/* 阶段清单：把后端 done_list / running_list 如实画出来，与后台日志一一对应 */
.qfile-steps { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.step {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  font-size: 12px; line-height: 1.35;
  color: var(--ink-3); background: var(--surface-soft); border: 1px solid var(--border);
}
.step .icon { width: 12px; height: 12px; }
.step.is-done { color: var(--success); background: var(--success-soft); border-color: transparent; }
.step.is-running { color: var(--accent); background: var(--accent-soft); border-color: transparent; font-weight: 500; }

.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px;
  border-radius: 999px;
  font-size: 12px; font-weight: 500; flex: none;
}
.status-badge .icon { width: 13px; height: 13px; }
.status-queued { background: var(--surface-muted); color: var(--ink-2); border: 1px solid var(--border); }
.status-uploading { background: var(--accent-soft); color: var(--accent); }
.status-success { background: var(--success-soft); color: var(--success); }
.status-error { background: var(--danger-soft); color: var(--danger); }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 40px 20px; text-align: center; color: var(--ink-3);
}
.empty .icon { width: 30px; height: 30px; color: var(--border-strong); }
.empty-title { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.empty-desc { font-size: 13px; }

/* ============================================================
   操作条：吸底浮动，让主 CTA 始终在视野内
   ============================================================ */
.actionbar {
  position: sticky;
  bottom: 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 20px;
  background: rgba(255,255,255,.90);
  backdrop-filter: saturate(160%) blur(10px);
  -webkit-backdrop-filter: saturate(160%) blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: 0 12px 30px rgba(16,24,40,.10);
}
.actionbar-meta { font-size: 13px; color: var(--ink-2); }
.actionbar-meta strong { color: var(--ink); font-weight: 600; }
.actionbar-actions { margin-left: auto; display: flex; gap: 10px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease, box-shadow var(--dur) ease, transform var(--dur) ease;
}
.btn .icon { width: 17px; height: 17px; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-cta); }
.btn-primary:not(:disabled):hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(46,85,145,.32); }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.btn-secondary:not(:disabled):hover { background: var(--surface-muted); }
.btn-ghost { background: transparent; color: var(--ink-2); padding: 0 10px; height: 34px; }
.btn-ghost:not(:disabled):hover { background: var(--surface-muted); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

/* ============================================================
   侧栏：导入须知
   ============================================================ */
.side-head {
  display: flex; align-items: center; gap: 9px;
  padding: 18px 22px 0;
}
.side-head .icon { width: 17px; height: 17px; color: var(--accent); }
.side-title { font-size: 15px; font-weight: 600; }
.side-body { padding: 14px 22px 20px; }
.tip-list { display: flex; flex-direction: column; gap: 13px; }
.tip { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
.tip .icon { width: 16px; height: 16px; color: var(--success); margin-top: 3px; flex: none; }
.tip b { color: var(--ink); font-weight: 600; }

/* ============================================================
   Toast
   ============================================================ */
.toast-wrap {
  position: fixed; right: 24px; bottom: 24px; z-index: 80;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: #fff; padding: 12px 16px;
  border-radius: var(--r-md); box-shadow: var(--shadow-pop);
  font-size: 14px; min-width: 240px; max-width: 360px;
  animation: toastIn 220ms ease both; pointer-events: auto;
}
.toast .icon { width: 18px; height: 18px; flex: none; }
.toast.ok .icon { color: #6EE7B7; }
.toast.err .icon { color: #FCA5A5; }
.toast.leaving { animation: toastOut 180ms ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col-side { flex-direction: row; flex-wrap: wrap; }
  .col-side > .card { flex: 1 1 300px; }
}
@media (max-width: 720px) {
  .page { padding: 28px 16px 40px; }
  .page-title { font-size: 21px; }
  .page-head { gap: 13px; }
  .dropzone { padding: 34px 18px; }
  .card-body { padding: 18px; }
  .actionbar { flex-direction: column; align-items: stretch; }
  .actionbar-actions { margin-left: 0; }
  .actionbar-actions .btn { flex: 1; }
  .toast-wrap { left: 16px; right: 16px; bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="page">

  <!-- ===================== 页头 ===================== -->
  <div class="page-head">
    <div class="head-icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/></svg>
    </div>
    <div>
      <p class="page-desc">导入 PDF 或 Markdown 文档，系统将自动解析、分块并向量化，用于知识库的语义检索。</p>
    </div>
  </div>

  <!-- ===================== 主体 ===================== -->
  <div class="layout">

    <!-- 主区 -->
    <div class="col-main">

      <section class="card">
        <!-- 上传区 -->
        <div class="card-body">
          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="点击或拖拽文件到此区域上传">
            <div class="dz-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/></svg>
            </div>
            <p class="dz-title"><span class="link">点击上传</span>，或拖拽文件到此区域</p>
            <p class="dz-desc">支持批量导入，单文件不超过 50&nbsp;MB</p>
            <div class="dz-formats">
              <span class="chip pdf"><i class="dot"></i>PDF</span>
              <span class="chip md"><i class="dot"></i>Markdown (.md)</span>
            </div>
            <input type="file" id="fileInput" accept=".pdf,.md,.markdown" multiple hidden>
          </div>
        </div>

        <!-- 待导入队列 -->
        <div class="queue-head">
          <span class="queue-title">待导入文件</span>
          <span class="count-pill" id="fileCount">0</span>
          <span class="spacer"></span>
          <button class="btn btn-ghost" id="clearBtn" disabled>清空列表</button>
        </div>
        <div class="queue-list" id="queueList" aria-live="polite"></div>
      </section>

      <!-- 操作条 -->
      <div class="actionbar">
        <div class="actionbar-meta">
          <span>待导入 <strong id="barCount">0</strong> 个文件</span>
          <span aria-hidden="true"> · </span>
          <span>合计 <strong id="barSize">0 B</strong></span>
        </div>
        <div class="actionbar-actions">
          <button class="btn btn-secondary" id="cancelBtn" disabled>清空并取消</button>
          <button class="btn btn-primary" id="startBtn" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            开始导入
          </button>
        </div>
      </div>
    </div>

    <!-- 侧栏 -->
    <aside class="col-side">
      <section class="card">
        <div class="side-head">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><circle cx="12" cy="8" r=".6" fill="currentColor"/></svg>
          <span class="side-title">导入须知</span>
        </div>
        <div class="side-body">
          <div class="tip-list">
            <div class="tip">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              <span>文件将解析为纯文本后分块，图片与复杂排版可能丢失。</span>
            </div>
            <div class="tip">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              <span>单批建议不超过 <b>200</b> 个文件，超大文件请拆分后导入。</span>
            </div>
            <div class="tip">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              <span>导入任务在后台异步执行，可在<b>导入记录</b>中查看进度。</span>
            </div>
            <div class="tip">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              <span>已导入文档重复提交时，将按去重策略跳过。</span>
            </div>
          </div>
        </div>
      </section>
    </aside>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="assertive"></div>

<script>
(function () {
  var MAX_BYTES = 50 * 1024 * 1024;
  var ACCEPTED = { pdf: true, md: true, markdown: true };

  // 后端导入服务地址（以 web/api/import_service.py 的 uvicorn 配置为准：
  // host=127.0.0.2，port=8001）
  var API_BASE = 'http://127.0.0.2:8001';
  // 任务状态轮询间隔（毫秒）
  var POLL_INTERVAL = 1500;

  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var queueList = document.getElementById('queueList');
  var fileCount = document.getElementById('fileCount');
  var clearBtn = document.getElementById('clearBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var startBtn = document.getElementById('startBtn');
  var barCount = document.getElementById('barCount');
  var barSize = document.getElementById('barSize');
  var toastWrap = document.getElementById('toastWrap');

  var files = [];
  var seq = 0;
  var importing = false;

  function extOf(name) {
    var m = /\.([a-z0-9]+)$/i.exec(name || '');
    return m ? m[1].toLowerCase() : '';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function iconSvg(name) {
    if (name === 'check') return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    if (name === 'x') return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    if (name === 'clock') return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    if (name === 'inbox') return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h4l1.5 2.5h5L16 13h4"/><path d="M5.5 5h13l1.5 8v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4z"/></svg>';
    return '';
  }

  function toast(message, kind) {
    var el = document.createElement('div');
    el.className = 'toast ' + (kind === 'err' ? 'err' : 'ok');
    el.innerHTML = iconSvg(kind === 'err' ? 'x' : 'check') + '<span></span>';
    el.querySelector('span').textContent = message;
    toastWrap.appendChild(el);
    window.setTimeout(function () {
      el.classList.add('leaving');
      window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
    }, 2600);
  }

  function totals() {
    var total = 0;
    for (var i = 0; i < files.length; i++) total += files[i].size;
    return { count: files.length, size: total };
  }

  function updateBar() {
    var t = totals();
    fileCount.textContent = String(t.count);
    barCount.textContent = String(t.count);
    barSize.textContent = formatSize(t.size);
    var hasFiles = t.count > 0;
    startBtn.disabled = !hasFiles || importing;
    clearBtn.disabled = !hasFiles || importing;
    cancelBtn.disabled = !hasFiles || importing;
  }

  function statusBadge(f) {
    if (f.status === 'uploading') return '<span class="status-badge status-uploading">' + iconSvg('clock') + '上传中</span>';
    if (f.status === 'processing') return '<span class="status-badge status-uploading">' + iconSvg('clock') + '解析中</span>';
    if (f.status === 'success') return '<span class="status-badge status-success">' + iconSvg('check') + '已导入</span>';
    if (f.status === 'error') return '<span class="status-badge status-error">' + iconSvg('x') + '解析失败</span>';
    return '<span class="status-badge status-queued">待导入</span>';
  }

  // 真实完成率 = 已完成阶段数 / 后端给的阶段总数
  // 之前这里用的是 Math.min(90, 45 + done数*8)，属于前端自己编的进度，
  // 起手就 45%，跟后台"已完成 3 个阶段"对不上。现在完全以后端 steps 为准。
  function progressOf(f) {
    if (f.status === 'success') return 100;
    if (f.steps && f.steps.length) {
      return Math.min(99, Math.round(((f.done || []).length / f.steps.length) * 100));
    }
    // 兜底：后端还没返回 steps（例如后端没重启、仍是旧版接口）时，
    // 退化成"按已完成阶段数递增"的估计，避免进度条卡死在 0
    if (f.done && f.done.length) return Math.min(90, 10 + f.done.length * 10);
    return f.progress || 0;
  }

  // 阶段清单：数据全部来自后端（steps + done_list + running_list），前端不编造阶段名。
  // 这样「前端看到的」和「后台日志里的」就是同一份数据。
  function stageList(f) {
    var steps = Array.isArray(f.steps) ? f.steps.slice() : [];
    var done = f.done || [];
    var running = f.running || [];
    // 后端若返回了计划之外的阶段（比如以后图里加了新节点），补到末尾，
    // 避免出现"进度里有、清单里没有"的不一致
    done.concat(running).forEach(function (n) {
      if (steps.indexOf(n) === -1) steps.push(n);
    });
    if (!steps.length) return '';
    return '<div class="qfile-steps">' + steps.map(function (n) {
      var cls = running.indexOf(n) > -1 ? 'is-running' : (done.indexOf(n) > -1 ? 'is-done' : '');
      var icon = cls === 'is-running' ? iconSvg('clock') : (cls === 'is-done' ? iconSvg('check') : '');
      return '<span class="step ' + cls + '">' + icon + escapeHtml(n) + '</span>';
    }).join('') + '</div>';
  }

  function renderQueue() {
    if (!files.length) {
      queueList.innerHTML =
        '<div class="empty">' + iconSvg('inbox') +
        '<span class="empty-title">暂无待导入文件</span>' +
        '<span class="empty-desc">添加 PDF 或 Markdown 文件后，将在此处显示解析进度。</span></div>';
      updateBar();
      return;
    }
    var html = '';
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var progressPct = progressOf(f);
      var barClass = f.status === 'success' ? 'success' : (f.status === 'error' ? 'error' : '');
      var showProgress = f.status !== 'queued';
      var label = f.ext ? f.ext.toUpperCase() : 'FILE';
      // 进度条右侧文字：直接给后端的阶段计数，和 /status 里的 done/steps 完全对应
      var stageText = '';
      if (f.status === 'uploading') stageText = '上传中';
      else if (f.status === 'processing') {
        stageText = (f.steps && f.steps.length)
          ? ((f.done || []).length + '/' + f.steps.length + ' 阶段')
          : '解析中';
      }
      else if (f.status === 'success') stageText = '完成';
      else if (f.status === 'error') stageText = '已中断';
      html +=
        '<div class="qfile" data-id="' + f.id + '">' +
          '<div class="qfile-icon ' + f.ext + '">' + label + '</div>' +
          '<div class="qfile-main">' +
            '<div class="qfile-name" title="' + escapeAttr(f.name) + '">' + escapeHtml(f.name) + '</div>' +
            '<div class="qfile-meta">' + formatSize(f.size) + ' · ' + label + ' 文档</div>' +
            (showProgress ?
              '<div class="qfile-progress">' +
                '<div class="progress ' + barClass + '"><span style="width:' + progressPct + '%"></span></div>' +
                '<span class="qfile-status">' + stageText + '</span>' +
              '</div>' : '') +
            stageList(f) +
          '</div>' +
          statusBadge(f) +
          '<button class="btn btn-ghost" data-remove="' + f.id + '" aria-label="移除 ' + escapeAttr(f.name) + '"' + (importing ? ' disabled' : '') + '>' +
            iconSvg('x') +
          '</button>' +
        '</div>';
    }
    queueList.innerHTML = html;
    updateBar();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function addFiles(list) {
    var added = 0, rejectedType = 0, rejectedSize = 0;
    for (var i = 0; i < list.length; i++) {
      var file = list[i];
      var ext = extOf(file.name);
      if (!ACCEPTED[ext]) { rejectedType++; continue; }
      if (file.size > MAX_BYTES) { rejectedSize++; continue; }
      files.push({ id: ++seq, name: file.name, size: file.size, ext: ext, status: 'queued', progress: 0, raw: file, steps: [], done: [], running: [] });
      added++;
    }
    if (added) {
      renderQueue();
      toast('已添加 ' + added + ' 个文件到导入列表');
    }
    if (rejectedType) toast('已忽略 ' + rejectedType + ' 个不支持的文件格式', 'err');
    if (rejectedSize) toast('已忽略 ' + rejectedSize + ' 个超过 50 MB 的文件', 'err');
  }

  // 是否还有未结束的任务（上传中 / 解析中）
  function hasActiveTask() {
    return files.some(function (f) { return f.status === 'uploading' || f.status === 'processing'; });
  }

  // 所有任务结束后，复位状态并汇总提示
  function finishIfIdle() {
    if (hasActiveTask()) return;
    importing = false;
    updateBar();
    var ok = files.filter(function (x) { return x.status === 'success'; }).length;
    var bad = files.filter(function (x) { return x.status === 'error'; }).length;
    toast('导入完成：成功 ' + ok + ' 个' + (bad ? '，失败 ' + bad + ' 个' : ''));
  }

  // 轮询单个任务状态，刷新进度与日志
  function pollTask(file, taskId) {
    var timer = window.setInterval(function () {
      fetch(API_BASE + '/status/' + taskId)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          file.done = Array.isArray(data.done_list) ? data.done_list : [];
          file.running = Array.isArray(data.running_list) ? data.running_list : [];
          // 阶段计划（后端 /status 返回），前端拿它算真实进度
          if (Array.isArray(data.steps)) file.steps = data.steps;

          if (data.status === 'completed') {
            window.clearInterval(timer);
            file.status = 'success';
            file.progress = 100;
            renderQueue();
            finishIfIdle();
          } else if (data.status === 'failed') {
            window.clearInterval(timer);
            file.status = 'error';
            renderQueue();
            toast('「' + file.name + '」解析失败，请重试', 'err');
            finishIfIdle();
          } else {
            // pending / processing：进度由「已完成阶段数 ÷ 阶段总数」真实推导
            file.status = 'processing';
            file.progress = progressOf(file);
            renderQueue();
          }
        })
        .catch(function () {
          // 单次轮询失败忽略，下个周期继续
        });
    }, POLL_INTERVAL);
  }

  // 真实上传：把列表文件一次性 POST 到后端，拿到 task_ids 后逐个轮询
  function runImport() {
    if (importing || !files.length) return;
    var pending = files.filter(function (f) { return f.status === 'queued' || f.status === 'error'; });
    if (!pending.length) {
      toast('列表中的文件均已导入');
      return;
    }

    importing = true;
    pending.forEach(function (f) {
      f.status = 'uploading';
      f.progress = 15;
      f.steps = [];
      f.done = [];
      f.running = [];
    });
    updateBar();
    renderQueue();

    var formData = new FormData();
    pending.forEach(function (f) { formData.append('files', f.raw); });

    fetch(API_BASE + '/upload', { method: 'POST', body: formData })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (result) {
        var taskIds = (result && result.task_ids) || [];
        if (taskIds.length !== pending.length) {
          throw new Error('task_ids 数量(' + taskIds.length + ')与提交文件数(' + pending.length + ')不一致');
        }
        toast('已提交导入任务：共 ' + pending.length + ' 个文件');
        // task_ids 与 pending 顺序一一对应
        pending.forEach(function (f, i) {
          f.status = 'processing';
          f.progress = 45;
          pollTask(f, taskIds[i]);
        });
        renderQueue();
      })
      .catch(function (err) {
        pending.forEach(function (f) { f.status = 'error'; f.progress = 0; });
        importing = false;
        updateBar();
        renderQueue();
        toast('导入提交失败：' + (err && err.message ? err.message : '网络异常'), 'err');
      });
  }

  dropzone.addEventListener('click', function () { if (!importing) fileInput.click(); });
  dropzone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!importing) fileInput.click(); }
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) {
      e.preventDefault();
      if (!importing) dropzone.classList.add('is-drag');
    });
  });
  ['dragleave', 'drop'].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) {
      e.preventDefault();
      dropzone.classList.remove('is-drag');
    });
  });
  dropzone.addEventListener('drop', function (e) {
    if (importing) return;
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  queueList.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove]');
    if (!btn || importing) return;
    var id = Number(btn.getAttribute('data-remove'));
    files = files.filter(function (f) { return f.id !== id; });
    renderQueue();
  });

  clearBtn.addEventListener('click', function () {
    if (importing) return;
    files = [];
    renderQueue();
    toast('已清空导入列表');
  });
  cancelBtn.addEventListener('click', function () {
    if (importing) return;
    files = [];
    renderQueue();
    toast('已取消本次导入');
  });
  startBtn.addEventListener('click', runImport);

  renderQueue();
})();
</script>

</body>
</html>
